name: Build & Publish CTP

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a new CTP release if set to true
        required: false
        default: "false"
  push:
    branches:
      - act4
    paths:
      - "ctp/**"
      - "generators/ctp/**"
      - "testplans/**"
      - ".github/workflows/ctp-build.yml"
  pull_request:
    branches:
      - act4
    paths:
      - "ctp/**"
      - "generators/ctp/**"
      - "testplans/**"
      - ".github/workflows/ctp-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7

      - run: git submodule update --init ctp/docs-resources

      - name: Pull Container
        run: docker pull riscvintl/riscv-docs-base-container-image:latest

      - name: Build
        run: cd ctp && make -j2

      - name: Make GitHub pages directory
        run: |
          mkdir github-pages
          cp ctp/build/ctp.html github-pages/index.html

      - name: Upload PDF
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ctp.pdf
          path: ctp/build/ctp.pdf

      - name: Upload HTML
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ctp.html
          path: ctp/build/ctp.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: github-pages

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/act4') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download PDF
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ctp.pdf
          path: ./

      - name: Download HTML
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ctp.html
          path: ./

      - name: Get current date
        run: |
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${GITHUB_SHA::7})" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@60cfd9a691d814dcf0d094598101c5cb61cd1646
        with:
          draft: false
          prerelease: ${{ ! (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') }}
          make_latest: true
          # generate_release_notes: true
          tag_name: ctp-release-${{ env.SHORT_SHA }}-${{ env.CURRENT_DATE }}
          name: ctp-release-${{ env.SHORT_SHA }}-${{ env.CURRENT_DATE }}
          body: |
            This release was created by: ${{ github.event.sender.login }}
          files: |
            ctp.pdf
            ctp.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/act4'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
